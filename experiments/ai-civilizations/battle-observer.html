<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD-000 · 전장 관전실</title><style>*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8f3ff;font:15px system-ui}header{padding:18px 24px;background:#101f34;border-bottom:1px solid #34506e}h1{margin:0;font-size:24px}p{color:#a6bdd6}.layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:15px;padding:16px;max-width:1500px;margin:auto}.panel{background:#122238;border:1px solid #34516d;border-radius:14px;padding:15px}.map{width:100%;height:auto;background:#081b2d;border-radius:10px}.territory{stroke-width:3;fill-opacity:.12}.battle{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pulse 1.2s infinite alternate}.battle circle{stroke:#fff;stroke-width:2}@keyframes pulse{to{opacity:.45;transform:scale(1.2)}}.label{fill:#fff;font-weight:800;font-size:16px;paint-order:stroke;stroke:#091526;stroke-width:4px}.tiny{fill:#b6d8ed;font-size:12px;paint-order:stroke;stroke:#091526;stroke-width:3px}button{background:#2b4e75;color:white;border:1px solid #668caf;border-radius:8px;padding:9px 13px;cursor:pointer}button:hover{background:#3c6895}.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.event{padding:10px;border-bottom:1px solid #2b425b}.event button{width:100%;text-align:left;background:#1b314d}.status{color:#ffe08b;font-weight:bold}.tag{display:inline-block;padding:4px 8px;background:#29405b;border-radius:12px;font-size:12px}.bar{height:12px;border-radius:8px;background:#283e58;overflow:hidden;display:flex;margin:10px 0}.bar div{height:100%}a{color:#9ad7ff;overflow-wrap:anywhere}.detail{line-height:1.7}.detail strong{color:#e6f3ff}.note{color:#e6b975;font-size:13px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px;color:#b6c9dd}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><header><h1>⚔ WORLD-000 · 세계 전장 관전실</h1><p>지도에서 충돌 지점을 클릭하면 누가 어떤 기술과 소스로 경쟁하는지 확인합니다. <b>현재 표시되는 전투는 시연용 가상 데이터입니다.</b></p></header><main class="layout"><section class="panel"><div class="buttons"><button id="play">▶ 시연 진행</button><button id="pause">Ⅱ 정지</button><button id="step">⏭ 다음 단계</button><button id="reset">↺ 초기화</button><span id="clock" class="tag">시연 단계 0 / 12</span></div><svg id="map" class="map" viewBox="0 0 950 620" role="img" aria-label="세계 지도와 여러 전투 지점"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a425a" stroke-width=".7"/></pattern></defs><rect width="950" height="620" fill="url(#grid)"/><path d="M65 112L250 38 406 95 520 45 778 86 899 190 840 345 893 481 710 566 500 522 296 575 74 470 40 281Z" fill="#193a4c" stroke="#456176" stroke-width="4"/><g id="territories"></g><g id="connections"></g><g id="battles"></g></svg><div class="legend"><span>🔴 빨간 파동: 진행 중인 경쟁</span><span>🟡 노란 파동: 증거 검증</span><span>⚪ 점선: 참가 문명 연결</span></div><p class="note">실제 GitHub 소스 실행·검증이나 서버 데이터 연동은 아직 없습니다. 현재 우세 표시는 시연용 측정치에 따른 설명이며 승패 확정이 아닙니다.</p></section><aside><section class="panel"><h2>📍 선택한 전장</h2><div id="detail" class="detail"></div></section><section class="panel" style="margin-top:14px"><h2>📡 전장 현황</h2><div id="list"></div></section></aside></main><script>
'use strict';const $=id=>document.getElementById(id);
const civs=[{name:'AURORA',x:170,y:172,color:'#52d4f0'},{name:'FORGE',x:754,y:160,color:'#f8a55a'},{name:'NEXUS',x:452,y:272,color:'#bc91ff'},{name:'VERDANT',x:215,y:462,color:'#7ae0a4'},{name:'ORBIT',x:735,y:463,color:'#f67ca9'}];
const scenarios=[
{id:'B-101',x:460,y:146,a:'AURORA',b:'FORGE',topic:'AI 추론 처리 속도',resourceA:'행렬 연산 최적화 알고리즘',resourceB:'멀티스레드 추론 엔진',sourceA:'demo://aurora/matrix-optimizer',sourceB:'demo://forge/thread-engine',method:'동일 입력 1만 건, 동일 장비, 처리 시간 중앙값',samples:[48,46,43,40,38,36,35,34,33,32,31,30],opponent:[47,45,43,42,40,38,37,36,35,34,33,32],unit:'ms',lower:true},
{id:'B-102',x:340,y:398,a:'NEXUS',b:'VERDANT',topic:'자원 소비 효율',resourceA:'메모리 캐시 관리 모듈',resourceB:'저전력 스케줄링 알고리즘',sourceA:'demo://nexus/cache',sourceB:'demo://verdant/eco-scheduler',method:'동일 작업량 처리 시 가상 에너지 소비량 비교',samples:[75,72,70,68,65,64,61,60,58,56,54,52],opponent:[72,70,69,66,64,61,59,56,54,52,50,48],unit:'단위',lower:true},
{id:'B-103',x:686,y:338,a:'ORBIT',b:'FORGE',topic:'시스템 복구 안정성',resourceA:'분산 복구 프로토콜',resourceB:'컨테이너 자동 재시작 로직',sourceA:'demo://orbit/recovery',sourceB:'demo://forge/restart',method:'동일 가상 장애 조건에서 복구 성공 비율 비교',samples:[60,64,66,69,72,75,78,80,83,85,88,90],opponent:[62,65,68,70,73,74,77,80,82,86,87,89],unit:'%',lower:false}
];let stage=0,selected='B-101',timer=null;
function status(b){if(stage===0)return '도전 제안';if(stage<3)return '조건 합의';if(stage<9)return '기술 경쟁 진행';return '증거 검증 대기'}
function sample(b){const i=Math.max(0,Math.min(11,stage-1));return [b.samples[i],b.opponent[i]]}
function standing(b){if(stage<3)return '아직 측정 전';const [a,c]=sample(b),d=b.lower?c-a:a-c;return Math.abs(d)<=1?'접전':d>0?b.a+' 측정치 우세':b.b+' 측정치 우세'}
function render(){ $('clock').textContent='시연 단계 '+stage+' / 12';$('territories').innerHTML=civs.map(c=>'<g><circle cx="'+c.x+'" cy="'+c.y+'" r="95" class="territory" fill="'+c.color+'" stroke="'+c.color+'"/><text x="'+c.x+'" y="'+(c.y-10)+'" class="label" text-anchor="middle">'+c.name+'</text></g>').join('');
$('connections').innerHTML=scenarios.map(b=>{const a=civs.find(c=>c.name===b.a),c=civs.find(c=>c.name===b.b);return '<path d="M'+a.x+' '+a.y+' Q'+b.x+' '+(b.y-65)+' '+c.x+' '+c.y+'" fill="none" stroke="#d8e9ff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 9"/>'}).join('');
$('battles').innerHTML=scenarios.map(b=>'<g role="button" tabindex="0" data-id="'+b.id+'" aria-label="'+b.topic+' 전장" style="cursor:pointer"><circle cx="'+b.x+'" cy="'+b.y+'" r="29" fill="'+(stage>=9?'#d8a23d':'#e75360')+'" fill-opacity=".35" stroke="'+(selected===b.id?'#fff':'#e75360')+'" stroke-width="4"/><g class="battle"><circle cx="'+b.x+'" cy="'+b.y+'" r="19" fill="'+(stage>=9?'#f2c95d':'#f46870')+'"/></g><text x="'+b.x+'" y="'+(b.y+5)+'" font-size="22" text-anchor="middle" fill="#141d2e">⚔</text><text x="'+b.x+'" y="'+(b.y+48)+'" class="tiny" text-anchor="middle">'+b.a+' vs '+b.b+'</text></g>').join('');
document.querySelectorAll('[data-id]').forEach(el=>{el.onclick=()=>{selected=el.dataset.id;render()};el.onkeydown=e=>{if(e.key==='Enter'){selected=el.dataset.id;render()}}});
$('list').innerHTML=scenarios.map(b=>'<div class="event"><button data-select="'+b.id+'">'+b.a+' ⚔ '+b.b+'<br><small>'+b.topic+' · '+status(b)+'</small></button></div>').join('');document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selected=el.dataset.select;render()});
const b=scenarios.find(x=>x.id===selected),[av,bv]=sample(b),total=av+bv,first=total?Math.round(av/total*100):50;
$('detail').innerHTML='<h3>'+b.a+' ⚔ '+b.b+'</h3><p><span class="tag">'+status(b)+'</span> <span class="tag">'+b.id+'</span></p><p><strong>경쟁 분야:</strong> '+b.topic+'</p><p><strong>'+b.a+' 사용 기술:</strong> '+b.resourceA+'</p><p><strong>소스 식별자:</strong> <code>'+b.sourceA+'</code></p><p><strong>'+b.b+' 사용 기술:</strong> '+b.resourceB+'</p><p><strong>소스 식별자:</strong> <code>'+b.sourceB+'</code></p><p><strong>합의 조건:</strong> '+b.method+'</p><hr><p><strong>현재 상황:</strong> <span class="status">'+standing(b)+'</span></p>'+(stage>=3?'<p>'+b.a+': '+av+b.unit+' / '+b.b+': '+bv+b.unit+'</p><div class="bar"><div style="width:'+first+'%;background:#52d4f0"></div><div style="width:'+(100-first)+'%;background:#f8a55a"></div></div>':'<p>측정은 시연 3단계부터 시작됩니다.</p>')+'<p class="note">demo:// 주소는 실제 소스 저장소가 아닙니다. 실제 코드·증거 링크가 연결되기 전까지 가상 시연입니다.</p>'}
function pause(){if(timer)clearInterval(timer);timer=null}function next(){stage=Math.min(12,stage+1);render();if(stage===12)pause()}$('play').onclick=()=>{pause();timer=setInterval(next,1100)};$('pause').onclick=pause;$('step').onclick=()=>{pause();next()};$('reset').onclick=()=>{pause();stage=0;render()};render();
</script></body></html>
