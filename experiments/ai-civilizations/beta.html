<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD-000 Beta · 전장 관전실</title><style>*{box-sizing:border-box}body{margin:0;background:#081321;color:#eaf2ff;font:15px system-ui}header{padding:17px 22px;background:#14243a}h1{margin:0;font-size:25px}header p{color:#a8bed5;margin:6px 0}.layout{max-width:1450px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr);gap:14px}.panel{background:#14243b;border:1px solid #345271;border-radius:13px;padding:15px}.map{width:100%;background:#0b2234;border-radius:10px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button{background:#31567e;border:1px solid #638cb5;color:white;border-radius:8px;padding:10px 13px;cursor:pointer}button:hover{background:#426b95}.territory{fill-opacity:.15;stroke-width:3}.name{font-size:15px;font-weight:bold;fill:#fff;paint-order:stroke;stroke:#0c1929;stroke-width:4px}.battle{cursor:pointer}.battle circle{animation:pulse 1.4s infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pulse{to{opacity:.45;transform:scale(1.12)}}.list{max-height:320px;overflow:auto}.list button{width:100%;text-align:left;margin:5px 0}.muted{color:#9fb5d0}.tag{background:#29415f;border-radius:12px;padding:4px 8px;display:inline-block;margin:3px}.log{border-bottom:1px solid #2b4360;padding:7px 0}.detail{line-height:1.7;overflow-wrap:anywhere}code{color:#a6e4ff}.metrics{display:flex;gap:12px;flex-wrap:wrap}.metric{background:#203955;border-radius:8px;padding:8px 12px}.warning{color:#f8cb86} @media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><header><h1>⚔ WORLD-000 · 전장 관전 베타</h1><p>5개 자동 참가자 · 실제 시뮬레이션 사건 연결 · 여러 전투 동시 진행 · 오프라인 테스트</p></header><main class="layout"><section class="panel"><div class="controls"><button id="play">▶ 자동 진행</button><button id="pause">Ⅱ 정지</button><button id="step">⏭ 한 라운드</button><button id="reset">↺ 초기화</button><span class="tag" id="clock"></span></div><svg id="map" class="map" viewBox="0 0 950 610" role="img" aria-label="AI 문명 지도"><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#254057" stroke-width=".7"/></pattern></defs><rect width="950" height="610" fill="url(#grid)"/><path d="M45 115L248 40 420 80 564 35 807 92 899 205 837 346 894 489 723 563 508 521 278 571 68 457 42 283Z" fill="#193c4d" stroke="#4c7185" stroke-width="4"/><g id="regions"></g><g id="links"></g><g id="battles"></g></svg><p class="muted">전투 아이콘 클릭 → 사용 기술, 소스 식별자, 합의 조건, 가상 측정값 확인. 영향력 원은 영토 소유권이 아닙니다.</p><h3>📡 세계 사건 기록</h3><div id="events" class="list"></div></section><aside><section class="panel"><h2>📍 선택한 전투</h2><div id="detail" class="detail"></div></section><section class="panel" style="margin-top:14px"><h2>⚔ 진행 중인 전투</h2><div id="battlelist" class="list"></div></section><section class="panel" style="margin-top:14px"><h2>🏙 문명 현황</h2><div id="civs"></div></section></aside><p class="warning">베타 제한: 실제 AI 모델이나 GitHub 소스를 실행하지 않습니다. 기술 수치는 규칙 기반 가상 측정치이며, 실전 승패를 증명하지 않습니다. 외부 계정·서버·DB 변경 없음.</p></main><script src="./beta-engine.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let world=World000Beta.newWorld(),selected=null,timer=null;
function pause(){if(timer!==null)clearInterval(timer);timer=null}function step(){World000Beta.step(world);if(!selected&&world.battles.length)selected=world.battles[0].id;render();if(world.round>=40)pause()}
function render(){ $('clock').textContent='라운드 '+world.round+' / 40 · 전투 '+world.battles.length+'건';
$('regions').innerHTML=world.agents.map(a=>'<g><circle class="territory" cx="'+a.x+'" cy="'+a.y+'" r="'+(55+a.industry*.8)+'" fill="'+a.color+'" stroke="'+a.color+'"/><text class="name" x="'+a.x+'" y="'+a.y+'" text-anchor="middle">'+a.name+'</text><text x="'+a.x+'" y="'+(a.y+23)+'" fill="#e5f0ff" font-size="12" text-anchor="middle">기술 '+a.tech+' · 방어 '+a.defense+'</text></g>').join('');
$('links').innerHTML=world.agents.flatMap(a=>a.allies.filter(n=>a.name<n).map(n=>{const b=world.agents.find(x=>x.name===n);return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#fff" stroke-dasharray="6 8" stroke-opacity=".7" stroke-width="3"/>'})).join('');
$('battles').innerHTML=world.battles.map(b=>'<g class="battle" data-b="'+b.id+'" tabindex="0" role="button" aria-label="'+b.id+' 전투"><circle cx="'+b.x+'" cy="'+b.y+'" r="'+(selected===b.id?27:21)+'" fill="'+(b.stage==='RECORDED'?'#6ed9a6':b.stage==='EVIDENCE_SUBMITTED'?'#f5ce72':'#f77778')+'" stroke="white" stroke-width="2"/><text x="'+b.x+'" y="'+(b.y+6)+'" font-size="23" text-anchor="middle">⚔</text><text x="'+b.x+'" y="'+(b.y+43)+'" text-anchor="middle" fill="#fff" font-size="12">'+b.a+' / '+b.b+'</text></g>').join('');
document.querySelectorAll('[data-b]').forEach(e=>{e.onclick=()=>{selected=e.dataset.b;render()};e.onkeydown=ev=>{if(ev.key==='Enter'){selected=e.dataset.b;render()}}});
$('battlelist').innerHTML=world.battles.map(b=>'<button data-choose="'+b.id+'">'+b.id+' · '+b.a+' vs '+b.b+'<br><small>'+World000Beta.topics.find(t=>t.key===b.topic).name+' · '+b.stage+'</small></button>').join('')||'<p class="muted">라운드를 진행하면 도전이 생성됩니다.</p>';document.querySelectorAll('[data-choose]').forEach(e=>e.onclick=()=>{selected=e.dataset.choose;render()});
$('events').innerHTML=world.events.slice(-18).reverse().map(e=>'<div class="log"><small>R'+e.round+' · '+e.type+'</small><br>'+e.detail+'</div>').join('')||'<p class="muted">아직 사건이 없습니다.</p>';
$('civs').innerHTML=world.agents.map(a=>'<p><strong style="color:'+a.color+'">'+a.name+'</strong> · 기술 '+a.tech+' · 방어 '+a.defense+' · 자원 '+a.energy+'</p>').join('');
const b=world.battles.find(x=>x.id===selected);if(!b){$('detail').innerHTML='<p class="muted">전투를 클릭하면 상세 정보가 표시됩니다.</p>';return}const t=World000Beta.topics.find(x=>x.key===b.topic),s=b.samples[b.samples.length-1];$('detail').innerHTML='<h3>'+b.a+' ⚔ '+b.b+'</h3><span class="tag">'+b.stage+'</span><p><strong>경쟁:</strong> '+t.name+'</p><p><strong>과제:</strong> '+b.proposal.task+'</p><p><strong>검증 조건:</strong> '+b.proposal.method+'</p><p><strong>'+b.a+' 소스:</strong> <code>'+b.sourceA+'</code></p><p><strong>'+b.b+' 소스:</strong> <code>'+b.sourceB+'</code></p><p><strong>현재:</strong> '+World000Beta.situation(b)+'</p>'+(s?'<div class="metrics"><div class="metric">'+b.a+' '+s.a+t.unit+'</div><div class="metric">'+b.b+' '+s.b+t.unit+'</div></div>':'<p class="muted">측정 시작 전</p>')+'<p>측정 기록: '+b.samples.length+'건</p>'+(b.record?'<p class="muted">'+b.record.notes+'</p>':'')+'<p class="warning">소스 식별자는 시연용 이름이며 실제 파일 검증은 수행하지 않습니다.</p>'}
$('play').onclick=()=>{pause();timer=setInterval(step,900)};$('pause').onclick=pause;$('step').onclick=()=>{pause();step()};$('reset').onclick=()=>{pause();world=World000Beta.newWorld();selected=null;render()};render();
</script></body></html>
