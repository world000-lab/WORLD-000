<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD-000 관전실</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#0b1120;color:#e8efff;max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}p{color:#aabbd4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:#243b65;color:white;border:1px solid #4e6892;border-radius:8px;padding:10px 16px;cursor:pointer}button:hover{background:#35568e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,.panel{background:#15213a;border:1px solid #314564;border-radius:12px;padding:16px}.card h3{margin:0 0 10px}.card p{margin:5px 0}.panel{margin-top:16px}#events{max-height:360px;overflow:auto}#events p{border-bottom:1px solid #283850;padding:8px 0;margin:0}#round{font-weight:bold;color:#9ce7ef}.muted{color:#8fa4c5}small{color:#8fa4c5}input{accent-color:#6ad1e2}</style></head><body><h1>🌍 WORLD-000 · AI 문명 관전실</h1><p>비공개 오프라인 실험 · 5개 규칙 기반 참가자 · 서버 연결 없음 · 점수/순위 없음</p><div class="controls"><button id="play">▶ 자동 진행</button><button id="pause">Ⅱ 일시정지</button><button id="step">⏭ 한 라운드</button><button id="reset">↺ 처음부터</button><label>속도 <input id="speed" type="range" min="200" max="2000" step="100" value="900"></label><span id="round">라운드 0 / 12</span></div><div id="agents" class="grid"></div><section class="panel"><h2>📜 공동 규칙</h2><div id="rules" class="muted">아직 승인된 규칙이 없습니다.</div></section><section class="panel"><h2>📡 사건 기록</h2><div id="events"></div></section><p><small>실제 LLM 간 대화가 아닌 규칙 기반 시뮬레이션입니다. 실행과 데이터는 이 브라우저 안에서만 처리됩니다.</small></p><script>
'use strict';const NAMES=['AURORA','FORGE','NEXUS','VERDANT','ORBIT'],STRATEGIES=['연구','산업','외교','생태','탐험'];let agents=[],rules=[],events=[],round=0,timer=null,seed=20261122;
function rand(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
function reset(){pause();seed=20261122;round=0;rules=[];events=[];agents=NAMES.map((name,i)=>({name,strategy:STRATEGIES[i],energy:12,knowledge:2,trust:3,alliances:[],projects:0}));render()}
function add(actor,msg){events.push({round,actor,msg})}
function next(){if(round>=12){pause();return}round++;let proposer=agents[(round-1)%5],rule=round%2?'공동 연구':'자원 절제',votes=agents.map(a=>rule==='공동 연구'?a.knowledge>=2:a.energy>=7),approved=votes.filter(Boolean).length>=3;
add(proposer.name,'규칙 제안: '+rule+' / 찬성 '+votes.filter(Boolean).length+'표 → '+(approved?'승인':'부결'));if(approved)rules.push({round,rule});
for(const a of agents){let action;if(a.energy<=3)action='자원 확보';else if(a.strategy==='연구')action='연구';else if(a.strategy==='산업')action='건설';else if(a.strategy==='생태')action='자원 확보';else if(a.strategy==='외교')action='협상';else action=rand()<.6?'탐험':'연구';
if(action==='자원 확보')a.energy+=4;if(action==='연구'){a.energy-=2;a.knowledge+=2+(rules.some(r=>r.rule==='공동 연구')?1:0)}if(action==='건설'){a.energy-=3;a.projects++}if(action==='탐험'){a.energy-=2;a.knowledge++;a.projects+=rand()<.4?1:0}
if(action==='협상'){let other=agents.filter(b=>b!==a&&!a.alliances.includes(b.name)).sort((x,y)=>y.trust-x.trust)[0];if(other&&other.energy>=3&&a.energy>=3){a.alliances.push(other.name);other.alliances.push(a.name);a.energy--;other.energy--;add(a.name,other.name+'와 동맹 체결')}else a.energy+=2}
add(a.name,action+' 수행');}
for(const a of agents)a.energy+=rules.some(r=>r.rule==='자원 절제')?1:2;
render();if(round===12)pause()}
function render(){document.getElementById('round').textContent='라운드 '+round+' / 12';document.getElementById('agents').innerHTML=agents.map(a=>'<article class="card"><h3>'+a.name+'</h3><p>'+a.strategy+' 전략</p><p>⚡ 자원 '+a.energy+'</p><p>🧠 기술 '+a.knowledge+'</p><p>🏗 건설 '+a.projects+'</p><p>🤝 동맹 '+(a.alliances.join(', ')||'없음')+'</p></article>').join('');
document.getElementById('rules').textContent=rules.length?rules.map(r=>'라운드 '+r.round+': '+r.rule).join(' · '):'아직 승인된 규칙이 없습니다.';
document.getElementById('events').innerHTML=events.slice().reverse().map(e=>'<p><small>R'+e.round+'</small> <strong>'+e.actor+'</strong> · '+e.msg+'</p>').join('')||'<p>시작 버튼을 누르면 사건이 표시됩니다.</p>'}
function pause(){if(timer!==null)clearInterval(timer);timer=null}
document.getElementById('play').onclick=()=>{pause();timer=setInterval(next,Number(document.getElementById('speed').value))};
document.getElementById('pause').onclick=pause;document.getElementById('step').onclick=()=>{pause();next()};document.getElementById('reset').onclick=reset;document.getElementById('speed').oninput=()=>{if(timer!==null){pause();document.getElementById('play').click()}};reset();
</script></body></html>
