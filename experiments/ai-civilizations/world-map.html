<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD-000 · 문명 관전 지도</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e1c;color:#e7f1ff;font:15px system-ui,sans-serif}header{padding:18px 22px;background:#101c31;border-bottom:1px solid #273c59}h1{font-size:23px;margin:0}header p{margin:6px 0 0;color:#9bb0ca}.wrap{max-width:1300px;margin:auto;padding:18px}.buttons{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button{background:#28446c;border:1px solid #5477a5;color:white;padding:10px 15px;border-radius:8px;cursor:pointer}button:hover{background:#39608f}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.panel{background:#131e32;border:1px solid #2c4260;border-radius:13px;padding:14px}.map{width:100%;height:auto;border-radius:8px;background:#07172b}.land{stroke:#243b55;stroke-width:3}.region{stroke-width:3;transition:fill .3s,stroke-width .3s}.node{transition:transform .3s}.title{font-size:14px;fill:#fff;font-weight:800;paint-order:stroke;stroke:#081020;stroke-width:4px}.sub{font-size:11px;fill:#d4e7ff;paint-order:stroke;stroke:#081020;stroke-width:3px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-top:14px}.card{border:1px solid #344c6e;background:#17243a;border-radius:10px;padding:12px}.card h3{margin:0 0 8px}.metric{display:flex;align-items:center;gap:8px;margin:7px 0}.metric span{width:48px;color:#afc1da;font-size:12px}.track{height:9px;flex:1;background:#26364e;border-radius:8px;overflow:hidden}.bar{height:100%;border-radius:8px}.metric b{width:25px;text-align:right;font-size:12px}.events{max-height:260px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid #2a3a51;color:#d5e2f5}.muted{color:#91a8c5}.tag{padding:4px 8px;border-radius:12px;background:#223953;color:#d1e4fa}#round{font-weight:bold;color:#7de6d3}@media(max-width:850px){.layout{grid-template-columns:1fr}} </style></head><body><header><h1>🌍 WORLD-000 · 문명 관전 지도</h1><p>5개 문명이 스스로 성장하고 경쟁하는 비공개 시뮬레이션 · 승패 판정 없음</p></header><main class="wrap"><div class="buttons"><button id="start">▶ 자동 진행</button><button id="pause">Ⅱ 일시정지</button><button id="next">⏭ 한 라운드</button><button id="reset">↺ 다시 시작</button><span id="round">라운드 0 / 30</span><span class="tag">강약은 영역별 능력으로 표시</span></div><div class="layout"><section class="panel"><h2>세계 지도</h2><svg class="map" viewBox="0 0 900 560" role="img" aria-label="5개 문명의 영향력과 도시 발전, 동맹을 표시하는 지도"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#25405a" stroke-width=".7"/></pattern></defs><rect width="900" height="560" fill="url(#grid)"/><path class="land" fill="#18334a" d="M70 95L210 38 365 80 442 36 570 72 780 55 846 168 812 278 861 384 748 509 577 479 458 531 285 492 101 425 55 285Z"/><g id="links"></g><g id="regions"></g></svg><p class="muted">원 크기 = 영향력 범위 · 성벽 = 방어력 · 건물 = 산업 발전 · 선 = 동맹. 지도 영역은 소유권 이전이 아닌 활동 영향력입니다.</p></section><aside class="panel"><h2>📡 세계에서 벌어진 일</h2><div id="events" class="events"></div></aside></div><section class="cards" id="cards"></section><p class="muted">무료·오프라인 규칙 기반 실험입니다. 실제 언어모델 에이전트나 공개 서버 게임은 아닙니다.</p></main><script>
'use strict';const C=[{name:'AURORA',color:'#54d6ed',x:205,y:165,focus:'tech'},{name:'FORGE',color:'#f5a34c',x:650,y:152,focus:'industry'},{name:'NEXUS',color:'#b78bff',x:430,y:284,focus:'military'},{name:'VERDANT',color:'#73d49a',x:250,y:408,focus:'economy'},{name:'ORBIT',color:'#f16fa0',x:686,y:405,focus:'diplomacy'}];let agents=[],round=0,events=[],timer=null,seed=20261122;const $=id=>document.getElementById(id);function rand(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}function cap(n){return Math.max(0,Math.min(100,Math.round(n)))}function reset(){pause();round=0;seed=20261122;events=[];agents=C.map((c,i)=>({...c,tech:12+i*2,industry:12,economy:20,military:15,diplomacy:12,influence:22,allies:[]}));render()}function log(msg){events.unshift('R'+round+' · '+msg);events=events.slice(0,35)}function advance(){if(round>=30){pause();return}round++;for(const a of agents){const chosen=a.focus==='diplomacy'?(rand()<.6?'diplomacy':'economy'):rand()<.67?a.focus:['tech','industry','economy','military','diplomacy'][Math.floor(rand()*5)];a[chosen]=cap(a[chosen]+5+Math.floor(rand()*7));a.influence=cap(a.influence+1+Math.floor((a.economy+a.industry)/85));if(chosen==='industry')a.economy=cap(a.economy+2);if(chosen==='tech')a.industry=cap(a.industry+1);if(chosen==='military')a.economy=cap(a.economy-1);log(a.name+' · '+({tech:'기술 개발',industry:'산업 시설 확장',economy:'경제 기반 확대',military:'방어 시설 강화',diplomacy:'외교 관계 확대'})[chosen]);}
if(round%4===0){const a=agents[Math.floor(rand()*5)],b=agents.filter(x=>x!==a&&!a.allies.includes(x.name)).sort((x,y)=>y.diplomacy-x.diplomacy)[0];if(b&&a.diplomacy+b.diplomacy>35){a.allies.push(b.name);b.allies.push(a.name);log(a.name+' ↔ '+b.name+' 동맹 체결');}else log('동맹 협상 결렬');}
if(round%5===0){const a=agents[Math.floor(rand()*5)],b=agents.filter(x=>x!==a)[Math.floor(rand()*4)];const strengthA=a.military+a.tech*.4,strengthB=b.military+b.tech*.4;log(a.name+'과 '+b.name+' 사이에 국경 긴장 발생 · '+(strengthA>strengthB?a.name+'이 방어 우세':strengthA<strengthB?b.name+'이 방어 우세':'전력 균형'));}render();if(round>=30)pause()}
function metric(name,v,color){return '<div class="metric"><span>'+name+'</span><div class="track"><div class="bar" style="width:'+v+'%;background:'+color+'"></div></div><b>'+v+'</b></div>'}
function render(){ $('round').textContent='라운드 '+round+' / 30';$('links').innerHTML=agents.flatMap(a=>a.allies.filter(n=>a.name<n).map(n=>{const b=agents.find(x=>x.name===n);return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#fff" stroke-opacity=".65" stroke-width="3" stroke-dasharray="8 7"/>'})).join('');
$('regions').innerHTML=agents.map(a=>{const r=36+a.influence*.9,wall=2+a.military/14,buildings=Math.min(5,Math.floor(a.industry/20));let structures='';for(let i=0;i<buildings;i++)structures+='<rect x="'+(a.x-30+i*13)+'" y="'+(a.y+12-(i%3)*7)+'" width="10" height="'+(15+(i%3)*7)+'" fill="'+a.color+'" stroke="#081321" stroke-width="1"/>';return '<g><circle class="region" cx="'+a.x+'" cy="'+a.y+'" r="'+r+'" fill="'+a.color+'" fill-opacity=".17" stroke="'+a.color+'" stroke-opacity=".55"/><circle cx="'+a.x+'" cy="'+a.y+'" r="'+(27+wall)+'" fill="#12263d" stroke="'+a.color+'" stroke-width="'+wall+'"/>'+structures+'<text class="title" x="'+a.x+'" y="'+(a.y-43)+'" text-anchor="middle">'+a.name+'</text><text class="sub" x="'+a.x+'" y="'+(a.y-27)+'" text-anchor="middle">영향력 '+a.influence+'</text></g>'}).join('');
$('cards').innerHTML=agents.map(a=>'<article class="card" style="border-top:4px solid '+a.color+'"><h3>'+a.name+'</h3>'+metric('기술',a.tech,a.color)+metric('산업',a.industry,a.color)+metric('경제',a.economy,a.color)+metric('방어',a.military,a.color)+metric('외교',a.diplomacy,a.color)+'<small>동맹: '+(a.allies.join(', ')||'없음')+'</small></article>').join('');$('events').innerHTML=events.map(e=>'<div class="event">'+e+'</div>').join('')||'<p class="muted">시작 버튼을 누르면 문명들이 발전합니다.</p>'}
function pause(){if(timer)clearInterval(timer);timer=null}$('start').onclick=()=>{pause();timer=setInterval(advance,850)};$('pause').onclick=pause;$('next').onclick=()=>{pause();advance()};$('reset').onclick=reset;reset();
</script></body></html>
